<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>镇江公交翻牌票价表生成器</title>
<style>
    /* ==========================================================================
     Smartisan OS 风格（锤子 / 坚果）界面层
     只作用于编辑器和顶栏，右侧版面（SVG）保持原有设计不变
     参考：Smartisan OS UI Kit (Unofficial) / 真机 R2 取值
     ========================================================================== */
  :root{
    /* 灰阶 */
    --s-white:#ffffff;
    --s-grey-100:#fafafa;
    --s-grey-200:#f2f2f2;
    --s-grey-300:#eeeeee;
    --s-grey-400:#e2e2e2;
    --s-grey-500:#bababa;
    --s-grey-600:#9d9d9d;
    --s-grey-700:#7f7f7f;
    --s-grey-800:#636363;
    --s-grey-900:#333333;
    /* 蓝 / 语义色 */
    --s-blue-400:#5079d9;
    --s-blue-500:#3f68e2;
    --s-blue-600:#2f54d7;
    --s-btn-pressed:#4772e6;
    --s-grad-primary:linear-gradient(180deg,#5b87eb,#5883eb);
    --s-grad-toast:linear-gradient(180deg,#fcf6e6,#fcf3dc);
    /* 线 / 圆角 / 阴影 */
    --s-hair:.8px;
    --s-r-sm:4px;
    --s-r-md:6px;
    --s-r-lg:10px;
    --s-shadow-card:0 10px 16px rgba(0,0,0,.04);
    --s-inset-field:inset 0 4px 4px rgba(0,0,0,.04);
    --s-appbar-shadow:linear-gradient(180deg,rgba(0,0,0,.047),rgba(0,0,0,.004) 70%,rgba(0,0,0,0));
    --s-font:"Smartisan Compact","Inter",-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",
             "Noto Sans SC","Source Han Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",
             "Helvetica Neue",Arial,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--s-font);
    font-size:14px;
    color:var(--s-grey-900);
    background:#f5f5f5;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- 顶栏（App Bar 48）---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    height:48px;padding:0 14px;
    background:var(--s-white);
  }
  /* 真机顶栏下没有细线，是一道 14px 的渐隐阴影 */
  .topbar::after{
    content:"";position:absolute;left:0;right:0;top:100%;height:14px;
    background:var(--s-appbar-shadow);pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:10px;flex:none;z-index:1}
  /* 国标“城市公共交通标志”图形（由扫描图矢量化，见 logo.svg） */
  .logo{
    width:32px;height:32px;flex:none;border-radius:50%;
    display:grid;place-items:center;
    background:var(--s-grad-primary);
    color:#fff;
    padding:1px;
  }
  .logo svg{width:100%;height:100%;display:block}
  /* 顶栏小按钮：GitHub 入口 */
  .btn-gh{
    height:30px;padding:0 10px;gap:6px;
    display:inline-flex;align-items:center;
    border:var(--s-hair) solid #d3d3d3;
    border-radius:var(--s-r-sm);
    background:var(--s-white);
    color:var(--s-grey-800);
    font-size:13px;line-height:1;text-decoration:none;
  }
  .btn-gh:active{background:var(--s-grey-200)}
  .btn-gh svg{width:15px;height:15px;flex:none;fill:currentColor}
  .appbar-title{
    position:absolute;left:50%;top:calc(50% - .5px);transform:translate(-50%,-50%);
    margin:0;font-size:16px;font-weight:700;color:var(--s-grey-800);
    white-space:nowrap;pointer-events:none;
  }
  .actions{display:flex;align-items:center;gap:12px;flex:none;margin-left:auto;z-index:1}

  /* 小按钮 / 描边按钮（App Bar 用 30px）*/
  button{
    font-family:inherit;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    white-space:nowrap;
  }
  .btn-primary{
    height:30px;padding:0 12px;
    font-weight:700;color:var(--s-white);
    background:var(--s-grad-primary);
    border:var(--s-hair) solid var(--s-blue-500);
    border-radius:var(--s-r-sm);
  }
  .btn-primary:active{background:var(--s-btn-pressed);border-color:var(--s-blue-600)}
  .btn-primary:disabled{opacity:.3;background:var(--s-grad-primary);border-color:var(--s-blue-500);cursor:progress}
  .btn-outline{
    height:30px;padding:0 12px;
    color:#606060;background:transparent;
    border:.5px solid #d3d3d3;border-radius:var(--s-r-sm);
  }
  .btn-outline:active{background:var(--s-grey-200)}

  /* 示例下拉：做成小小的描边按钮 */
  .sel{position:relative;display:inline-flex}
  .sel::after{
    content:"";position:absolute;right:11px;top:9px;width:5px;height:5px;
    border-right:1.2px solid #b2b2b2;border-bottom:1.2px solid #b2b2b2;
    transform:rotate(45deg);pointer-events:none;
  }
  select{
    font-family:inherit;font-size:14px;color:#606060;
    height:30px;padding:0 26px 0 10px;
    background:transparent;border:.5px solid #d3d3d3;border-radius:var(--s-r-sm);
    appearance:none;-webkit-appearance:none;cursor:pointer;
  }
  select:active{background:var(--s-grey-200)}

  /* ---------- 主体 ---------- */
  main{display:flex;align-items:stretch;min-height:calc(100vh - 48px);background:#f5f5f5}

  .editor{
    width:400px;flex:none;
    height:calc(100vh - 48px);
    overflow-y:auto;
    padding:14px 12px 64px;
    background:transparent;
  }

  /* 分组列表卡片：白底 / 10 圆角 / 0.8 描边 / 极淡投影 */
  .card{
    background:var(--s-white);
    border:var(--s-hair) solid var(--s-grey-400);
    border-radius:var(--s-r-lg);
    box-shadow:var(--s-shadow-card);
    margin:0 0 14px;
    overflow:hidden;
  }
  .card:last-child{margin-bottom:0}
  .card-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    height:44px;padding:0 12px 0 18px;
    box-shadow:inset 0 calc(-1 * var(--s-hair)) 0 var(--s-grey-200);
  }
  .card-head h2{margin:0;font-size:16px;font-weight:400;color:var(--s-grey-900)}
  .badge{font-size:12px;color:var(--s-grey-700);white-space:nowrap}
  .badge.down{color:var(--s-grey-700)}

  .field{padding:12px 18px}
  .field:last-child{padding-bottom:14px}
  .field-label{
    display:block;
    font-size:12px;color:var(--s-grey-700);
    margin:0 0 6px;font-weight:400;
  }
  .field-hint{color:var(--s-grey-600);margin-left:6px}
  .hint{font-size:12px;line-height:1.65;color:var(--s-grey-600);margin:6px 0 0}

  /* 输入框：内凹阴影 + 细描边 */
  input[type="text"]{
    width:100%;height:34px;padding:0 12px;
    font-family:inherit;font-size:14px;color:var(--s-grey-900);
    background:var(--s-white);
    border:var(--s-hair) solid var(--s-grey-400);
    border-radius:var(--s-r-md);
    box-shadow:var(--s-inset-field);
    outline:none;
  }
  input[type="text"]:focus{border-color:#93b2f7}
  input::placeholder{color:#d9d9d9}

  .route-row{display:flex;align-items:center;gap:8px}
  .route-row input{height:38px;font-size:15px;font-weight:700}

  /* 行：上车站 / 至 / 下车站 / 票价 / 删除 */
  .col-head{
    display:grid;
    grid-template-columns:1fr 18px 1fr 58px 22px;
    gap:6px;
    padding:0 2px 6px;
    font-size:12px;
    color:var(--s-grey-600);
  }
  .col-head span:nth-child(4){text-align:center}

  .rows{display:flex;flex-direction:column;gap:8px}
  .row{
    display:grid;
    grid-template-columns:1fr 18px 1fr 58px 22px;
    gap:6px;
    align-items:center;
  }
  .row .zhi{font-size:12px;color:var(--s-grey-600);text-align:center}
  .row input{height:34px;padding:0 8px;font-size:14px}
  .row input.fare{text-align:center;padding:0 4px}

  /* 删除：红色圆形减号（锤子列表编辑态）*/
  .row .del{
    position:relative;width:22px;height:22px;padding:0;
    border-radius:50%;
    border:var(--s-hair) solid #cf453b;
    background:linear-gradient(180deg,#ec6a60,#e3564c);
    box-shadow:0 1px 1.5px rgba(0,0,0,.15);
    color:transparent;font-size:0;line-height:1;
  }
  .row .del::before{
    content:"";position:absolute;left:50%;top:50%;
    width:11px;height:2.4px;margin:-1.2px 0 0 -5.5px;
    border-radius:1px;background:#fff;
  }
  .row .del:active{background:#d84c42}

  /* 添加一行：卡片底部的列表行，绿色圆形加号 */
  .add{
    width:100%;height:50px;margin:0;padding:0 18px;
    gap:10px;
    font-size:16px;color:var(--s-blue-400);
    background:var(--s-white);
    border:0;
    box-shadow:inset 0 var(--s-hair) 0 var(--s-grey-200);
  }
  .add:active{background:#f8f8f8}
  .rd-add{
    position:relative;flex:none;
    width:22px;height:22px;border-radius:50%;
    background:linear-gradient(180deg,#a5d65c,#8fc445);
    border:var(--s-hair) solid #7fb236;
    box-shadow:0 1px 1.5px rgba(0,0,0,.15);
  }
  .rd-add::before,.rd-add::after{
    content:"";position:absolute;left:50%;top:50%;
    border-radius:1px;background:#fff;
  }
  .rd-add::before{width:11px;height:2.4px;margin:-1.2px 0 0 -5.5px}
  .rd-add::after{width:2.4px;height:11px;margin:-5.5px 0 0 -1.2px}

  .tips{
    font-size:12px;
    line-height:1.75;
    color:var(--s-grey-700);
    padding:4px 18px 0;
  }
  .tips b{color:var(--s-grey-800);font-weight:600}

  /* ---------- 预览 ---------- */
  .stage{
    flex:1;min-width:0;
    height:calc(100vh - 48px);
    padding:26px 32px 48px;
    display:flex;flex-direction:column;align-items:center;
    overflow:auto;
    background:#f5f5f5;
  }
  .board-wrap{
    width:100%;
    max-width:960px;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.10));
  }
  .board-wrap svg{display:block;width:100%;height:auto}
  .meta{
    margin:18px 0 0;
    font-size:12px;
    color:var(--s-grey-600);
  }
  .meta b{color:var(--s-grey-800);font-weight:600}

  /* Toast：暖黄底 + 棕字 */
  .toast{
    position:fixed;left:50%;bottom:32px;
    transform:translate(-50%,8px);
    display:inline-flex;align-items:center;justify-content:center;
    padding:12px 16px;
    font-size:14px;font-weight:700;color:#ad8a67;
    background:var(--s-grad-toast);
    border:.4px solid #d2b89c;
    border-radius:var(--s-r-md);
    opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:880px){
    main{flex-direction:column}
    .editor{width:100%;height:auto;padding:14px 12px 32px}
    /* 窄屏：版面固定在顶部，编辑区在下方滚动 */
    .stage{
      order:-1;
      position:sticky;
      top:48px;
      z-index:6;
      height:auto;
      padding:12px 14px;
      background:#f5f5f5;
      overflow:hidden;
    }
    .board-wrap{height:auto;display:block}
    .board-wrap svg{width:100%;height:auto;max-width:100%}
    .meta{display:none}
  }
  @media (max-width:900px){
    /* 顶栏变窄后标题不再绝对居中，改为占剩余空间，避免压到右侧按钮 */
    .appbar-title{
      position:static;transform:none;flex:1;min-width:0;
      font-size:14px;text-align:center;
      overflow:hidden;text-overflow:ellipsis;
    }
  }
  @media (max-width:560px){
    /* 窄屏优先保留功能控件，标题让位（版面本身已写明站名） */
    .appbar-title{display:none}
    .btn-gh{padding:0 8px}
    .btn-gh span{display:none}
    .actions{gap:8px;margin-left:auto}
    select{font-size:13px;padding:0 22px 0 8px}
    .sel::after{right:9px}
    .btn-primary,.btn-outline{padding:0 10px;font-size:13px}
  }
</style>
</head>

/* 行内四列宽度：上车站 / 至 / 下车站 / 票价 */

const COL_FROM = 276, COL_ZHI = 84, COL_TO = 276;
const ROW_RIGHT = S.panelX + S.panelW - 30;    // 票价右对齐线 1146

/* 标题 = 用户填写的线路名 + 固定后缀 */

/* 用户没写「路」时自动补上：601 → 601路 */

const KEY = 'busFareBoard.v1';

function blankState(){
  return {
    route: '001路',
    footer: '前门上、后门下、谢谢合作',
    dirs: [
      { name:'', rows:[{from:'',to:'',fare:''}] },
      { name:'', rows:[{from:'',to:'',fare:''}] }
    ]

/* ---------------------------- 状态 ---------------------------- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function normalize(s){
  const dirs = [0,1].map(i => {
    const d = (s && s.dirs && s.dirs[i]) || {};
    const rows = Array.isArray(d.rows) ? d.rows : [];
    return {
      name: String(d.name || ''),
      rows: rows.map(r => ({
        from: String(r.from || ''),
        to:   String(r.to   || ''),
        fare: String(r.fare || '')
      }))
    };
  });
  return {
    route: String((s && s.route) || ''),
    footer: String((s && s.footer) || ''),
    dirs: dirs
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return normalize(JSON.parse(raw));
  }catch(e){}
  return clone(PRESETS['601']);
}

let state = loadState();

let saveTimer = 0;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }, 250);
}

/* ---------------------------- 文字测量 ---------------------------- */
const measureCtx = document.createElement('canvas').getContext('2d');
function measure(text, fs, weight){
  measureCtx.font = `${weight || WEIGHT} ${fs}px ${FONT_STACK}`;
  return measureCtx.measureText(text).width;
}

/* ---------------------------- SVG 生成 ---------------------------- */
function esc(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function textEl(str, x, y, fs, fill, opt){
  opt = opt || {};
  const hs = opt.hs === undefined ? S.hs.display : opt.hs;
  const attrs = [
    `transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${hs} 1)"`,
    `font-family='${FONT_STACK}'`,
    `font-size="${fs.toFixed(2)}"`,
    `font-weight="${opt.weight || WEIGHT}"`,
    `fill="${fill}"`
  ];
  if(opt.anchor) attrs.push(`text-anchor="${opt.anchor}"`);
  if(opt.spacing) attrs.push(`letter-spacing="${opt.spacing.toFixed(2)}"`);
  if(opt.filter) attrs.push(`filter="url(#${opt.filter})"`);
  if(opt.stroke){
    attrs.push(`stroke="${opt.stroke}"`);
    attrs.push(`stroke-width="${opt.strokeWidth}"`);
    attrs.push('paint-order="stroke"');
    attrs.push('stroke-linejoin="round"');
  }
  return `<text ${attrs.join(' ')}>${esc(str)}</text>`;
}

/* 站名：在固定单元格内等距分散；宽度不够时只做横向压缩（字高不变），不缩小字号
   opt.hs     横向比例（默认 0.80）
   opt.maxGap 字距上限，避免两个字被拉得过开（默认不限） */
function distributed(str, x, w, baseFs, fill, baseline, opt){
  opt = opt || {};
  const hs = opt.hs === undefined ? S.hs.body : opt.hs;
  const maxGap = opt.maxGap === undefined ? Infinity : opt.maxGap;
  const chars = Array.from(String(str).replace(/\s+/g,'').trim());
  if(!chars.length) return '';

  const adv = chars.map(c => measure(c, baseFs) * hs);   // 每个字的自然宽度
  const total = adv.reduce((a,b) => a+b, 0);

  let k = 1, gap = 0;                     // k：横向压缩系数
  if(total > w && total > 0){
    k = w / total;                        // 字距已无空间 —— 压扁字宽
  }else if(chars.length > 1){
    gap = Math.min((w - total) / (chars.length - 1), maxGap);   // 还有空间 —— 分散对齐
  }

  const chs = hs * k;
  const used = total*k + gap*(chars.length - 1);
  let cx = x + (w - used)/2;              // 居中（未占满整格时）
  if(!isFinite(maxGap)) cx = x;           // 单元格场景从左边开始铺满

  let out = '';
  for(let i=0;i<chars.length;i++){
    out += textEl(chars[i], cx, baseline, baseFs, fill, {hs: chs});
    cx += adv[i]*k + gap;
  }
  return out;
}

function fareText(v){
  const s = String(v || '').trim();
  if(!s) return '';
  return /元$/.test(s) ? s : s + '元';
}

/* 行区域在面板内的上下留白比例：行数多时收紧，行数少时居中铺开 */
function rowPadRatio(n){
  if(n <= 1) return 0.04;
  if(n === 2) return 0.04;
  if(n <= 4) return 0.10;
  return 0.04;
}

/* 计算整体高度与各面板位置 */
function computeLayout(){
  const heights = state.dirs.map(d => {
    const n = Math.max(1, d.rows.filter(r => r.from || r.to || r.fare).length);
    const pr = rowPadRatio(n);
    const need = (n * S.rowPitch) / (1 - 2*pr);
    return Math.round(Math.max(S.basePanelH, need));
  });
  const p1 = S.headerH + S.headGap;
  const p2 = p1 + heights[0] + S.gap;
  const footer = p2 + heights[1];
  return { heights, p1, p2, footer, H: footer + S.footerH };
}

function panelSVG(dir, top, h){
  const out = [];
  out.push(`<rect x="${S.panelX}" y="${top}" width="${S.panelW}" height="${h}" fill="${S.color.panel}" filter="url(#panelShadow)"/>`);

  const cx = S.panelX + S.leftW/2 + 8;  // 左侧栏中心（略偏右，与原图一致）

  /* 开往 */
  const fsK = S.fs.kai;
  const gapK = fsK * 0.82;
  const yK = top + h*0.25 + fsK*0.37;
  out.push(textEl('开', cx - (fsK + gapK)/2, yK, fsK, S.color.teal, {anchor:'middle'}));
  out.push(textEl('往', cx + (fsK + gapK)/2, yK, fsK, S.color.teal, {anchor:'middle'}));

  /* 红色方向站名：与站名同样的规则 —— 框内分散，超出则只压宽度；
     两个字时限制字距，避免被拉得过开 */
  const name = String(dir.name || '').trim();
  if(name){
    const fs = S.fs.name;
    const boxW = S.nameBox;
    const yN = top + h*0.52 + fs*0.37;
    out.push(distributed(name, cx - boxW/2, boxW, fs, S.color.red, yN, {hs: S.hs.display, maxGap: 130}));
  }

  /* 方向 */
  const yF = top + h*0.78 + fsK*0.37;
  out.push(textEl('方', cx - (fsK + gapK)/2, yF, fsK, S.color.teal, {anchor:'middle'}));
  out.push(textEl('向', cx + (fsK + gapK)/2, yF, fsK, S.color.teal, {anchor:'middle'}));

  /* 票价行 */
  const rows = dir.rows.filter(r => r.from || r.to || r.fare);
  const n = rows.length;
  if(n){
    const pr = rowPadRatio(n);
    const areaTop = top + h*pr;
    const areaH = h*(1 - 2*pr);
    const pitch = areaH / n;
    const fs = S.fs.body;
    const zhiCx = ROW_X + COL_FROM + COL_ZHI/2;   // 「至」居中于两栏之间，左右间距相等
    const toX = ROW_X + COL_FROM + COL_ZHI;

    rows.forEach((r, i) => {
      const baseline = areaTop + pitch*(i + 0.5) + fs*0.37;

      out.push(distributed(r.from, ROW_X, COL_FROM, fs, S.color.blue, baseline));
      out.push(textEl('至', zhiCx, baseline, fs, S.color.teal, {anchor:'middle', hs: S.hs.body}));
      out.push(distributed(r.to, toX, COL_TO, fs, S.color.blue, baseline));

      const price = fareText(r.fare);
      if(price) out.push(textEl(price, ROW_RIGHT, baseline, fs, S.color.blue, {anchor:'end', hs: S.hs.body}));
    });
  }

  return out.join('\n');
}

function buildSVG(){
  const L = computeLayout();
  const H = L.H;
  const out = [];

  out.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${S.W}" height="${H}" viewBox="0 0 ${S.W} ${H}" role="img" aria-label="公交车翻牌点投币票价表">`);

  /* 滤镜：标题投影 / 面板阴影 / 底部文字投影 */
  out.push(`<defs>
    <filter id="titleShadow" x="-15%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="4" dy="5" stdDeviation="2.2" flood-color="#08313d" flood-opacity="0.55"/>
    </filter>
    <filter id="panelShadow" x="-8%" y="-12%" width="116%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="5" flood-color="#0a3742" flood-opacity="0.5"/>
    </filter>
    <filter id="footShadow" x="-15%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="3" dy="4" stdDeviation="1.6" flood-color="#0b3b47" flood-opacity="0.35"/>
    </filter>
  </defs>`);

  /* 背景 */
  out.push(`<rect x="0" y="0" width="${S.W}" height="${H}" fill="${S.color.bg}"/>`);

  /* 顶部标题色带 */
  out.push(`<rect x="0" y="0" width="${S.W}" height="${S.headerH}" fill="${S.color.header}"/>`);
  const title = routeLabel(state.route) + TITLE_SUFFIX;
  const titleFs = S.fs.title;
  const titleMax = S.W - 150;
  const tw = measure(title, titleFs) * S.hs.title;
  /* 标题过长时同样只压宽度，保持字高一致 */
  const hsT = tw > titleMax ? S.hs.title * titleMax / tw : S.hs.title;
  out.push(textEl(title, S.W/2, S.headerH*0.85, titleFs, S.color.white, {anchor:'middle', hs: hsT, filter:'titleShadow'}));

  /* 两块方向面板 */
  out.push(panelSVG(state.dirs[0], L.p1, L.heights[0]));
  out.push(panelSVG(state.dirs[1], L.p2, L.heights[1]));

  /* 底部提示语：深色字 + 白描边 */
  const foot = String(state.footer || '').trim();
  if(foot){
    const fs = S.fs.footer;
    const hs = S.hs.footer;
    const n = Array.from(foot).length;
    const ls = 4.5;
    /* 先按未压缩宽度排版，再统一乘横向缩放系数 */
    let w = (measure(foot, fs) + ls * Math.max(0, n-1)) * hs;
    const maxW = S.W - 100;
    const k = w > maxW ? maxW / w : 1;
    out.push(textEl(foot, S.W/2 - w*k/2, L.footer + S.footerH*0.75, fs*k, S.color.teal, {
      spacing: ls*k,
      hs: hs,
      stroke: '#FFFFFF',
      strokeWidth: 3.6*k,
      filter: 'footShadow'
    }));
  }

  out.push('</svg>');
  return { svg: out.join('\n'), H: H };
}

/* ---------------------------- 预览渲染 ---------------------------- */
const boardEl = document.getElementById('board');
const metaEl  = document.getElementById('meta');

let raf = 0;
function render(immediate){
  if(immediate){
    doRender();
    return;
  }
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(doRender);
}

function doRender(){
  const { svg, H } = buildSVG();
  boardEl.innerHTML = svg;
  metaEl.innerHTML = `版面 <b>${S.W} × ${H}</b> px · 导出 PNG 为 <b>${S.W*2} × ${H*2}</b> px`;
}

/* ---------------------------- 编辑器 ---------------------------- */
const editor = document.getElementById('editor');

function dirCard(dir, i){
  const rows = dir.rows.map((r, j) => `
    <div class="row">
      <input type="text" data-dir="${i}" data-row="${j}" data-field="from" value="${esc(r.from)}" placeholder="上车站" />
      <span class="zhi">至</span>
      <input type="text" data-dir="${i}" data-row="${j}" data-field="to" value="${esc(r.to)}" placeholder="下车站" />
      <input type="text" class="fare" data-dir="${i}" data-row="${j}" data-field="fare" value="${esc(r.fare)}" placeholder="元" inputmode="decimal" />
      <button class="del" data-del="${i}:${j}" title="删除该行">×</button>
    </div>`).join('');

  return `
  <section class="card">
    <div class="card-head">
      <h2>方向${i===0?'一':'二'}</h2>
      <span class="badge ${i===1?'down':''}">${i===0?'上行':'下行'} · ${dir.rows.length} 个翻牌点</span>
    </div>

    <div class="field">
      <label class="field-label">开往<span class="field-hint">该方向的终点站</span></label>
      <input type="text" data-dir="${i}" data-role="name" value="${esc(dir.name)}" placeholder="例如：小茅山公交站" />
    </div>

    <div class="field">
      <span class="field-label">翻牌点与票价</span>
      <div class="col-head"><span>上车站</span><span></span><span>下车站</span><span>票价</span><span></span></div>
      <div class="rows">${rows}</div>
    </div>
    <button class="add" data-add="${i}"><span class="rd-add"></span>添加翻牌点</button>
  </section>`;
}

      </div>
    </div>
    ${dirCard(state.dirs[0], 0)}
    ${dirCard(state.dirs[1], 1)}
    <p class="tips">
      <b>排版说明：</b>站名会在固定栏宽内自动分散对齐，字数越多字距越紧；超过栏宽时只压扁字宽，字高不变。票价自动靠右并补「元」。某方向翻牌点较多时，整块版面会自动加高。
    </p>
  `;
  editor.scrollTop = scroll;

  if(focus){
    const el = editor.querySelector(focus);
    if(el) el.focus();
  }
}

/* 事件：输入 */
editor.addEventListener('input', (e) => {
  const t = e.target;
  if(t.id === 'routeInput'){
    state.route = t.value;
    render(); save();
    return;
  }
  if(t.id === 'footerInput'){
    state.footer = t.value;
    render(); save();
    return;
  }
  if(t.dataset && t.dataset.dir !== undefined){
    const i = Number(t.dataset.dir);
    if(t.dataset.role === 'name'){
      state.dirs[i].name = t.value;
    }else{
      const j = Number(t.dataset.row);
      state.dirs[i].rows[j][t.dataset.field] = t.value;
      /* 更新行数徽标 */
      const card = t.closest('.card');
      if(card){
        const badge = card.querySelector('.badge');
        if(badge){
          const n = state.dirs[i].rows.length;
          badge.textContent = `${i===0?'上行':'下行'} · ${n} 个翻牌点`;
        }
      }
    }
    render(); save();
  }
});

/* 事件：点击（添加 / 删除） */
editor.addEventListener('click', (e) => {
  const addBtn = e.target.closest('[data-add]');
  if(addBtn){
    const i = Number(addBtn.dataset.add);
    state.dirs[i].rows.push({ from:'', to:'', fare:'' });
    renderEditor(`[data-dir="${i}"][data-row="${state.dirs[i].rows.length-1}"][data-field="from"]`);
    render(); save();
    return;
  }
  const delBtn = e.target.closest('[data-del]');
  if(delBtn){
    const [i, j] = delBtn.dataset.del.split(':').map(Number);
    state.dirs[i].rows.splice(j, 1);
    if(!state.dirs[i].rows.length) state.dirs[i].rows.push({ from:'', to:'', fare:'' });
    renderEditor();
    render(); save();
  }
});

/* ---------------------------- 导出 ---------------------------- */
function download(blob, filename){
  const a = document.createElement('a');
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function fileBase(){
  const r = String(state.route || '').trim().replace(/[\\/:*?"<>|]/g,'');
  return (r ? r + '路' : '') + '公交车翻牌点投币票价';
}

const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}


const GITHUB_URL = 'https://github.com/Rayista/zjgj-Flipping-Fare-Schedule-Generation-Tool';
const ghLink = document.getElementById('ghLink');
if(GITHUB_URL){
  ghLink.href = GITHUB_URL;
}else{
  ghLink.addEventListener('click', (e) => {
    e.preventDefault();
    toast('未填写仓库地址');
  });
}

const btnPng = document.getElementById('btnPng');
const btnSvg = document.getElementById('btnSvg');

btnSvg.addEventListener('click', () => {
  const { svg } = buildSVG();
  download(new Blob([svg], {type:'image/svg+xml;charset=utf-8'}), fileBase() + '.svg');
  toast('SVG 已导出');
});

btnPng.addEventListener('click', async () => {
  btnPng.disabled = true;
  const old = btnPng.textContent;
  btnPng.textContent = '正在导出…';
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const { svg, H } = buildSVG();
    const scale = 2;
    const url = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml;charset=utf-8'}));
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error('render failed'));
      img.src = url;
    });

    const canvas = document.createElement('canvas');
    canvas.width = S.W * scale;
    canvas.height = H * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = S.color.bg;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);

    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    download(blob, fileBase() + `@${scale}x.png`);
    toast('PNG 已导出（2 倍图）');
  }catch(err){
    console.error(err);
    toast('导出失败，请重试');
  }finally{
    btnPng.disabled = false;
    btnPng.textContent = old;
  }
});

document.getElementById('preset').addEventListener('change', (e) => {
  const v = e.target.value;
  e.target.value = '';
  if(!v) return;

  if(v === 'blank'){
    state = blankState();
  }else if(PRESETS[v]){
    state = clone(PRESETS[v]);
  }
  renderEditor();
  render(true);
  save();
  toast('已载入 ' + (v === 'blank' ? '空白模板' : v + ' 路示例'));
});

(function applyPresetParam(){
  const p = new URLSearchParams(location.search).get('preset');
  if(!p) return;
  if(p === 'blank') state = blankState();
  else if(PRESETS[p]) state = clone(PRESETS[p]);
})();

renderEditor();
render(true);
